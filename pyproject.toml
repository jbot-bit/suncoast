[project]
name = "vouch-portal"
version = "2.0.0"
description = "Community trust and reputation system for Telegram with upgraded vouch detection"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    "python-telegram-bot==20.7",
    "asyncpg==0.29.0",
    "pydantic==2.5.0",
    "python-dotenv==1.0.0",
    "pyjwt==2.8.0",
    "httpx==0.25.2",
    # Moderation Engine Dependencies
    "pyahocorasick==2.1.0",
    "confusable-homoglyphs==3.3.1",
    "ftfy==6.2.0",
    "rapidfuzz==3.6.1",
    "jellyfish==1.0.3",
    "pyyaml==6.0.1",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["bot", "database", "main", "vouch_parser"]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]
