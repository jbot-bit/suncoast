<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vouch Portal - Test Page</title>
    <link rel="stylesheet" href="/static/styles-new.css?v=2">
    <style>
        .test-container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 2rem;
        }
        .test-section {
            margin-bottom: 2rem;
            padding: 1rem;
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
        }
        .test-result {
            padding: 0.5rem;
            margin: 0.5rem 0;
            border-radius: var(--radius-md);
        }
        .test-pass {
            background: var(--accent-green-light);
            color: var(--accent-green);
        }
        .test-fail {
            background: var(--accent-red-light);
            color: var(--accent-red);
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>🔍 Vouch Portal - Debug Test Page</h1>
        <p>This page tests if all new files are loading correctly.</p>

        <div class="test-section">
            <h2>1. CSS Test</h2>
            <div id="css-test"></div>
            <div class="stat-card positive-votes" style="width: 200px; margin: 1rem 0;">
                <div class="stat-icon"></div>
                <div class="stat-value">42</div>
                <div class="stat-label">Positive</div>
            </div>
        </div>

        <div class="test-section">
            <h2>2. Icons.js Test</h2>
            <div id="icons-test"></div>
            <div style="display: flex; gap: 1rem; margin: 1rem 0;">
                <button class="btn btn-primary">
                    <span class="btn-icon-left"></span>
                    Test Button
                </button>
                <div class="stat-icon"></div>
            </div>
        </div>

        <div class="test-section">
            <h2>3. Skeleton.js Test</h2>
            <div id="skeleton-test"></div>
            <div id="skeleton-demo"></div>
        </div>

        <div class="test-section">
            <h2>4. Init-Icons.js Test</h2>
            <div id="init-icons-test"></div>
        </div>

        <div class="test-section">
            <h2>5. File Paths Test</h2>
            <div id="paths-test"></div>
        </div>
    </div>

    <script src="/static/icons.js"></script>
    <script src="/static/skeleton.js"></script>
    <script src="/static/init-icons.js"></script>

    <script>
        // Run tests
        window.addEventListener('DOMContentLoaded', () => {
            runTests();
        });

        function addResult(containerId, message, pass) {
            const container = document.getElementById(containerId);
            const div = document.createElement('div');
            div.className = `test-result ${pass ? 'test-pass' : 'test-fail'}`;
            div.textContent = (pass ? '✅ ' : '❌ ') + message;
            container.appendChild(div);
        }

        function runTests() {
            // Test 1: CSS
            const styles = window.getComputedStyle(document.body);
            const bgColor = styles.getPropertyValue('background-color');
            addResult('css-test', `CSS loaded: Background color is ${bgColor}`, bgColor.includes('10') || bgColor.includes('0a'));

            const cardBg = getComputedStyle(document.querySelector('.stat-card')).backgroundColor;
            addResult('css-test', `Card styling loaded: ${cardBg}`, cardBg !== '');

            // Test 2: Icons.js
            const iconsLoaded = typeof Icons !== 'undefined';
            addResult('icons-test', `Icons object exists: ${iconsLoaded}`, iconsLoaded);

            if (iconsLoaded) {
                addResult('icons-test', `Icons library has ${Object.keys(Icons).length} icons`, Object.keys(Icons).length > 20);
                addResult('icons-test', `thumbsUp icon exists: ${Icons.thumbsUp ? 'Yes' : 'No'}`, !!Icons.thumbsUp);
            }

            // Test 3: Skeleton.js
            const skeletonsLoaded = typeof SkeletonScreens !== 'undefined';
            addResult('skeleton-test', `SkeletonScreens object exists: ${skeletonsLoaded}`, skeletonsLoaded);

            if (skeletonsLoaded) {
                const demo = document.getElementById('skeleton-demo');
                demo.innerHTML = SkeletonScreens.vouchList(2);
                addResult('skeleton-test', 'Skeleton demo rendered above', true);
            }

            // Test 4: Init-Icons.js
            const initIconsLoaded = typeof window.reinitializeIcons !== 'undefined';
            addResult('init-icons-test', `Icon initialization function exists: ${initIconsLoaded}`, initIconsLoaded);

            // Wait a bit for icons to inject
            setTimeout(() => {
                const iconInjected = document.querySelector('.btn-icon-left svg') !== null;
                addResult('init-icons-test', `Icons auto-injected into buttons: ${iconInjected}`, iconInjected);

                const statIcon = document.querySelector('.stat-icon svg') !== null;
                addResult('init-icons-test', `Icons auto-injected into stat cards: ${statIcon}`, statIcon);
            }, 500);

            // Test 5: File paths
            testFilePath('/static/styles-new.css', 'paths-test');
            testFilePath('/static/icons.js', 'paths-test');
            testFilePath('/static/skeleton.js', 'paths-test');
            testFilePath('/static/init-icons.js', 'paths-test');
        }

        async function testFilePath(path, containerId) {
            try {
                const response = await fetch(path);
                const exists = response.ok;
                addResult(containerId, `${path}: ${exists ? 'Found' : 'Not Found ('+response.status+')'}`, exists);
            } catch (error) {
                addResult(containerId, `${path}: Error - ${error.message}`, false);
            }
        }
    </script>
</body>
</html>
