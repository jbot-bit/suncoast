<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vouch Beacon</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link rel="stylesheet" href="/static/styles_sleek.css">
</head>
<body>
    <!-- Loading Screen -->
    <div id="loadingScreen" class="loading-screen">
        <div class="loading-spinner"></div>
        <p class="loading-text">Loading...</p>
    </div>

    <!-- Main App Container -->
    <div id="app" class="app-container" style="display: none;">

        <!-- Navigation Header -->
        <header class="app-header">
            <div class="header-content">
                <div class="header-left">
                    <h1 class="app-logo">Vouch Beacon</h1>
                </div>
                <div class="header-right">
                    <button id="searchBtn" class="icon-btn" title="Search">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"></circle>
                            <path d="m21 21-4.35-4.35"></path>
                        </svg>
                    </button>
                    <button id="notificationsBtn" class="icon-btn" title="Notifications">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                        </svg>
                        <span class="notification-badge" style="display: none;">3</span>
                    </button>
                </div>
            </div>

            <!-- Search Bar (Hidden by default) -->
            <div id="searchBar" class="search-bar" style="display: none;">
                <input type="search" id="searchInput" placeholder="Search users..." autocomplete="off">
                <div id="searchResults" class="search-results"></div>
            </div>
        </header>

        <!-- Tab Navigation -->
        <nav class="tab-nav">
            <button class="tab-btn active" data-tab="profile">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
                <span>Profile</span>
            </button>
            <button class="tab-btn" data-tab="leaderboard">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M16 16v6m-4-6v6m-4-6v6"></path>
                    <path d="M3 3h18v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V3z"></path>
                    <polyline points="7 8 12 3 17 8"></polyline>
                </svg>
                <span>Leaders</span>
            </button>
            <button class="tab-btn" data-tab="network">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="3"></circle>
                    <circle cx="6" cy="6" r="2"></circle>
                    <circle cx="18" cy="6" r="2"></circle>
                    <circle cx="6" cy="18" r="2"></circle>
                    <circle cx="18" cy="18" r="2"></circle>
                    <line x1="9" y1="9" x2="6" y2="6"></line>
                    <line x1="15" y1="9" x2="18" y2="6"></line>
                    <line x1="9" y1="15" x2="6" y2="18"></line>
                    <line x1="15" y1="15" x2="18" y2="18"></line>
                </svg>
                <span>Network</span>
            </button>
        </nav>

        <!-- Main Content Area -->
        <main class="main-content">

            <!-- Profile Tab -->
            <section id="profileTab" class="tab-content active">
                <div class="profile-hero">
                    <div class="profile-avatar-large">
                        <div class="avatar-placeholder">
                            <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                <circle cx="12" cy="7" r="4"></circle>
                            </svg>
                        </div>
                    </div>
                    <h2 class="profile-name" id="profileName">Loading...</h2>
                    <p class="profile-username" id="profileUsername">@username</p>

                    <div class="profile-stats-row">
                        <div class="stat-box">
                            <div class="stat-value" id="vouchesReceived">0</div>
                            <div class="stat-label">Vouches Received</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-value" id="vouchesGiven">0</div>
                            <div class="stat-label">Vouches Given</div>
                        </div>
                    </div>

                    <div class="profile-actions">
                        <button id="shareProfileBtn" class="btn btn-primary">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="18" cy="5" r="3"></circle>
                                <circle cx="6" cy="12" r="3"></circle>
                                <circle cx="18" cy="19" r="3"></circle>
                                <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
                                <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
                            </svg>
                            Share Profile
                        </button>
                    </div>
                </div>

                <!-- Vouches Received Section -->
                <div class="section-container">
                    <div class="section-header">
                        <h3 class="section-title">Vouches Received</h3>
                        <span class="section-count" id="receivedCount">0</span>
                    </div>
                    <div id="vouchesReceivedList" class="vouches-list">
                        <!-- Loading state -->
                        <div class="skeleton-card"></div>
                        <div class="skeleton-card"></div>
                        <div class="skeleton-card"></div>
                    </div>
                </div>

                <!-- Vouches Given Section -->
                <div class="section-container">
                    <div class="section-header">
                        <h3 class="section-title">Vouches Given</h3>
                        <span class="section-count" id="givenCount">0</span>
                    </div>
                    <div id="vouchesGivenList" class="vouches-list">
                        <!-- Loading state -->
                        <div class="skeleton-card"></div>
                        <div class="skeleton-card"></div>
                    </div>
                </div>
            </section>

            <!-- Leaderboard Tab -->
            <section id="leaderboardTab" class="tab-content">
                <div class="section-container">
                    <div class="leaderboard-tabs">
                        <button class="lb-tab-btn active" data-board="most_vouched">
                            Most Vouched
                        </button>
                        <button class="lb-tab-btn" data-board="top_givers">
                            Top Givers
                        </button>
                    </div>

                    <div id="leaderboardList" class="leaderboard-list">
                        <!-- Loading state -->
                        <div class="skeleton-card"></div>
                        <div class="skeleton-card"></div>
                        <div class="skeleton-card"></div>
                    </div>
                </div>
            </section>

            <!-- Network Tab -->
            <section id="networkTab" class="tab-content">
                <div class="section-container">
                    <div class="section-header">
                        <h3 class="section-title">Trust Network</h3>
                        <button id="centerNetworkBtn" class="icon-btn">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="12" r="10"></circle>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>

                    <div class="network-info">
                        <p>Interactive visualization of your trust network. Click nodes to explore connections.</p>
                    </div>

                    <div id="networkViz" class="network-visualization">
                        <!-- D3.js network graph will be rendered here -->
                    </div>

                    <div class="network-legend">
                        <div class="legend-item">
                            <div class="legend-dot legend-you"></div>
                            <span>You</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-dot legend-vouched"></div>
                            <span>Vouched by you</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-dot legend-voucher"></div>
                            <span>Vouched for you</span>
                        </div>
                    </div>
                </div>
            </section>

        </main>
    </div>

    <!-- Toast Notifications -->
    <div id="toastContainer" class="toast-container"></div>

    <!-- Scripts -->
    <script src="/static/main_beacon.js"></script>
</body>
</html>
